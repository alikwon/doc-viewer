<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>문서 뷰어</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 서재 -->
<section id="library" class="view">
  <header class="bar">
    <h1>서재</h1>
    <span class="grow"></span>
    <button id="btn-add" class="icon" title="휴대폰에 있는 txt 열기">＋</button>
    <button id="btn-sync" class="icon" title="지금 동기화">⟳</button>
  </header>
  <input id="file" type="file" accept=".txt,text/plain" hidden>
  <div id="account" class="notice" hidden>
    <p id="account-msg">구글 드라이브에 연결하면 PC에서 읽던 위치·북마크를 맞춰요. (책 파일은 올리지 않아요)</p>
    <button id="btn-connect" class="primary">구글 계정 연결</button>
  </div>
  <ul id="books"></ul>
  <p id="empty" class="muted center" hidden>아직 책이 없어요.<br>PC 뷰어에서 책을 열거나, ＋ 로 휴대폰에 있는 txt 를 여세요.</p>
  <footer id="lib-status" class="muted"></footer>
</section>

<!-- 읽기 -->
<section id="reader" class="view" hidden>
  <div id="text" tabindex="0"></div>
  <header id="top" class="bar overlay" hidden>
    <button id="btn-back" class="icon" title="서재">←</button>
    <span id="title" class="grow ellipsis"></span>
    <button id="btn-mark" class="icon" title="북마크 추가">☆</button>
    <button id="btn-marks" class="icon" title="북마크 목록">≡</button>
    <button id="btn-style" class="icon" title="글자 설정">가</button>
  </header>
  <footer id="bottom" class="bar overlay" hidden>
    <input id="seek" type="range" min="0" max="1000" step="1" aria-label="위치">
    <span id="pct">0%</span>
  </footer>
  <div id="loading" class="center muted" hidden>책을 여는 중...</div>
</section>

<!-- 아래에서 올라오는 판 -->
<div id="sheet" hidden>
  <div id="sheet-body"></div>
</div>

<div id="toast" hidden><span id="toast-msg"></span><button id="toast-btn" hidden></button></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
